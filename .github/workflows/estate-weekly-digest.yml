name: Estate360 weekly digest

# Emails the owner the week's irrigation compliance (missed days, zone status,
# gaps) and the expenses the estate manager logged, with the date each was
# logged. Same external-cron pattern as checkout-emails.yml: Pages Functions
# have no native `scheduled` handler, so this calls the CRON_SECRET-guarded
# runEstateWeeklyDigest endpoint over HTTP.
on:
  schedule:
    # 01:30 UTC Monday = 7:00 AM IST Monday (covers the 7 days ending Sunday)
    - cron: '30 1 * * 1'
  workflow_dispatch: {}   # run it on demand from the Actions tab

jobs:
  send:
    runs-on: ubuntu-latest
    steps:
      - name: Call runEstateWeeklyDigest
        run: |
          curl -sS -X POST "https://manage.stayvibe360.com/api/runEstateWeeklyDigest" \
            -H "Content-Type: application/json" \
            -H "X-Cron-Secret: ${{ secrets.CRON_SECRET }}" \
            -d '{}' \
            --fail-with-body
